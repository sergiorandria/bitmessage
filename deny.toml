[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2023-0071", # rsa Marvin — no fix, via arti-client/transitive
    "RUSTSEC-2024-0413", # gtk-rs atk unmaintained — via gtk 0.18
    "RUSTSEC-2024-0416", # atk-sys unmaintained
    "RUSTSEC-2024-0412", # gdk unmaintained
    "RUSTSEC-2024-0418", # gdk-sys unmaintained
    "RUSTSEC-2024-0415", # gtk unmaintained
    "RUSTSEC-2024-0420", # gtk-sys unmaintained
    "RUSTSEC-2024-0419", # gtk3-macros unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained — transitive via gtk
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained
    "RUSTSEC-2024-0429", # glib VariantStrIter unsound — gtk
    "RUSTSEC-2025-0141", # bincode unmaintained — via arti
    "RUSTSEC-2026-0192", # ttf-parser unmaintained — via egui/eframe
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Zlib", "CC0-1.0", "Unicode-3.0", "OFL-1.1", "LicenseRef-UFL-1.0", "Unlicense", "0BSD", "BSD-2-Clause", "MPL-2.0", "BSL-1.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
