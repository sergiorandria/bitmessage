[package]
name = "bitmessage-rs"
version = "0.5.0"
edition = "2021"
description = "Bitmessage client in Rust with egui GUI"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/bitmessage/bitmessage-rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
[lints.clippy]
pedantic = { level = "allow", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
incompatible_msrv = "allow"
needless_bool = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Crypto
k256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha1 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc"] }
hmac = "0.12"
digest = "0.10"
rand = "0.8"
argon2 = "0.5"
bs58 = "0.5"
hex = "0.4"

# Storage
rusqlite = { version = "0.38", features = ["bundled"] }

# Async / Network
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["clock"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
subtle = "2.6"

# System tray
tray-icon = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# File dialog
rfd = "0.15"

# Tor
arti-client = { version = "0.40", features = ["tokio", "native-tls"] }
tor-rtcompat = { version = "0.40", features = ["tokio"] }
